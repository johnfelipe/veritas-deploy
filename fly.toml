# Veritas (Next.js 14) on Fly.io
# App name is set at first deploy via `fly launch` or `fly apps create`.

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATA_DIR = "/data"
  SEED_ON_BOOT = "true"

[[mounts]]
  source = "veritas_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
